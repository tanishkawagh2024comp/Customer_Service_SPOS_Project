<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Service Center - Round Robin Scheduler</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="layout">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-title">Customer Service Center</span>
        <span class="brand-sub">Round Robin Scheduler</span>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-page="dashboard">Dashboard</a>
        <a href="#/queries" data-page="queries">Customer Queries</a>
        <a href="#/agents" data-page="agents">Service Agents</a>
        <a href="#/simulator" data-page="simulator">Scheduler Simulator</a>
        <a href="#/analysis" data-page="analysis">Performance Analysis</a>
        <a href="#/history" data-page="history">Simulation History</a>
        <a href="#/settings" data-page="settings">Settings</a>
      </nav>
      <p class="sidebar-note">Educational simulation: time is measured in simulated service minutes.</p>
    </aside>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-body">
      <h3 id="confirmTitle">Please confirm</h3>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn">Cancel</button>
        <button value="ok" class="btn btn-danger" id="confirmOk">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="formDialog">
    <form id="formDialogForm" class="dialog-body" novalidate>
      <h3 id="formTitle"></h3>
      <div id="formFields"></div>
      <p id="formError" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="formCancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="formSubmit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/vendor/chart.umd.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
