spring.application.name=customer-service-round-robin
server.port=8080

# SQLite database file (created automatically in ./data). foreign_keys=true enables FK enforcement.
spring.datasource.url=jdbc:sqlite:./data/customerservice.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time, so a single pooled connection avoids "database is locked".
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# The schema is created by schema.sql (idempotent), not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Never leak stack traces or internal details to API clients.
server.error.include-stacktrace=never
server.error.include-message=never

springdoc.swagger-ui.path=/swagger-ui.html
